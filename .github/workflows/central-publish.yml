name: Publish to the Ballerina central

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: Select environment
        required: true
        options:
          - CENTRAL
      release_version:
        type: string
        description: Enter the release version
        required: true
        default: "1.0.1"
      org:
        type: string
        description: Enter the organization name
        required: true
        default: "ballerinax"

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Read the pinned Ballerina version
        id: versions
        run: |
          echo "ballerina=$(grep -oP '(?<=^ballerinaLangVersion=).*' gradle.properties)" >> "$GITHUB_OUTPUT"

      - name: Install Ballerina
        uses: ballerina-platform/setup-ballerina@v1
        with:
          version: ${{ steps.versions.outputs.ballerina }}

      - name: Publish to Ballerina Central
        env:
          BALLERINA_CENTRAL_ACCESS_TOKEN: ${{ secrets.BALLERINA_CENTRAL_ACCESS_TOKEN }}
        run: |
          ./gradlew publishToCentral --no-daemon \
            -Pversion=${{ inputs.release_version }} \
            -PpackageOrg=${{ inputs.org }}

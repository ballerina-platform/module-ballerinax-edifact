name: Publish to the Ballerina central

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: Select environment
        required: true
        options:
          - CENTRAL
      release_version:
        type: string
        description: Enter the release version
        required: true
        default: "1.0.0"
      org:
        type: string
        description: Enter the organization name
        required: true
        default: "ballerinax"

jobs:
  publish-release:
    runs-on: ubuntu-latest
    env:
      BALLERINA_VERSION: 2201.13.3
      EDI_TOOL_VERSION: 2.2.0
      DIRECTORIES: d03a
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ballerina
        uses: ballerina-platform/setup-ballerina@v1
        with:
          version: ${{ env.BALLERINA_VERSION }}

      - name: Pull EDI tool
        run: bal tool pull edi:${{ env.EDI_TOOL_VERSION }}

      - name: Generate Ballerina library packages
        run: |
          for version in $DIRECTORIES; do
            for path in "$version"/*/; do
              package=$(basename "$path")
              echo "::group::libgen edifact.$version.$package"
              bal edi libgen \
                -p "${{ inputs.org }}/edifact.$version.$package" \
                -i "$version/$package" \
                -o target
              python3 scripts/apply_package_metadata.py \
                "target/edifact.$version.$package" \
                "$package" \
                "${{ inputs.release_version }}" \
                "${{ inputs.org }}"
              echo "::endgroup::"
            done
          done

      - name: Pack
        run: |
          for path in target/*/; do
            package=$(basename "$path")
            echo "::group::pack $package"
            (cd "$path" && bal pack)
            echo "::endgroup::"
          done

      - name: Push to Ballerina Central
        env:
          BALLERINA_CENTRAL_ACCESS_TOKEN: ${{ secrets.BALLERINA_CENTRAL_ACCESS_TOKEN }}
        run: |
          for path in target/*/; do
            package=$(basename "$path")
            echo "::group::push $package"
            (cd "$path" && bal push)
            echo "::endgroup::"
          done

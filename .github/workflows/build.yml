name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Read the pinned Ballerina version
        id: versions
        run: |
          echo "ballerina=$(grep -oP '(?<=^ballerinaLangVersion=).*' gradle.properties)" >> "$GITHUB_OUTPUT"

      - name: Install Ballerina
        uses: ballerina-platform/setup-ballerina@v1
        with:
          version: ${{ steps.versions.outputs.ballerina }}

      # Generates every library from its committed EDI schemas, packs them, and
      # fails if the schemas were committed without being post-processed.
      - name: Build
        run: ./gradlew build --no-daemon

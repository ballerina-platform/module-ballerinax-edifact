name: Build

on:
  push:
    branches:
      - main
    paths:
      - 'd03a/**'
      - 'build-config/**'
      - 'metadata/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/build.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'd03a/**'
      - 'build-config/**'
      - 'metadata/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Read the pinned Ballerina version
        id: versions
        run: |
          echo "ballerina=$(grep -oP '(?<=^ballerinaLangVersion=).*' gradle.properties)" >> "$GITHUB_OUTPUT"

      - name: Install Ballerina
        uses: ballerina-platform/setup-ballerina@v1
        with:
          version: ${{ steps.versions.outputs.ballerina }}

      # Generates every library from its committed EDI schemas, packs them, and
      # checks the schemas are well formed and fully described.
      - name: Build
        run: ./gradlew build --no-daemon
